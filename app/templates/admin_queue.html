<!DOCTYPE html>
<html><body>
<h1>Admin Moderation Queue</h1>
<p>Logged in as: {{ admin.email }}</p>
<table border="1" cellpadding="8">
  <tr><th>Host</th><th>Port</th><th>Score</th><th>Status</th></tr>
  {% for h in hosts %}
  <tr><td>{{ h.host }}</td><td>{{ h.port }}</td><td>{{ h.score }}</td><td>{{ h.status }}</td></tr>
  {% else %}
  <tr><td colspan="4">No pending hosts found.</td></tr>
  {% endfor %}
</table>
<br>
<a href="/dashboard">Back to Dashboard</a>
</body></html>
